name: CI

on:
  push:
    branches:
        - main
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  PY_COLORS: "1"

jobs:
  ci:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: windows-latest

    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run type checks
        run: uv run poe typecheck

      - name: Run core tests
        run: uv run pytest tests/core

      - name: Run wx integration tests
        run: uv run pytest tests/wx_integration --cov-append

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/

  create_wheel_and_sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.13'

      - name: Build wheel and sdist
        run: uv build

      - name: Upload wheel and sdist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Package-Distributions-construct-editor
          path: dist/